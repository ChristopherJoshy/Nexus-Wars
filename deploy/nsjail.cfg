# nsjail config for untrusted bot execution.
# Layers (per design): nsjail empty netns (this file) + gVisor(runsc) + host
# iptables egress drop + seccomp policy. No single layer is trusted alone.
#
# NOTE: nsjail configs are environment-specific. Validated on Ubuntu 24.04 /
# WSL2 (kernel 6.18). Tune mounts/limits to your base image.

name: "nexus-bot"
description: "Nexus Wars untrusted bot sandbox"
mode: ONCE                    # run the bot command once and exit
hostname: "bot"
cwd: "/work"

# Private network namespace (loopback only, no routes) -> no external connectivity.
clone_newnet: true
# Own PID + UTS namespaces so a bot cannot signal host processes or see them.
clone_newpid: true
clone_newuts: true

# CPU / memory / file-size limits. Tune to match actTimeout/runTimeout.
rlimit_cpu_type: HARD
rlimit_cpu: 30
rlimit_as_type: HARD
rlimit_as: 536870912          # 512 MB address space
rlimit_fsize_type: HARD
rlimit_fsize: 1048576         # 1 MB files
rlimit_nofile_type: HARD
rlimit_nofile: 64
rlimit_nproc_type: HARD
rlimit_nproc: 64

# Kill (not errno) on any syscall not in the allowlist below.
seccomp_policy_file: "/etc/nsjail/seccomp.policy"

# --- Read-only host system mounts needed to run /usr/bin/python3 ----------
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
  options: "nosuid,nodev"
}

mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
  options: "nosuid,nodev"
}

mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
  options: "nosuid,nodev"
}

mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
  rw: false
  options: "nosuid,nodev"
}

mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: false
  options: "nosuid,nodev"
}

# --- Writable: the extracted bot and a small tmpfs ------------------------
mount {
  src: "/work"
  dst: "/work"
  is_bind: true
  rw: true
  options: "nosuid,nodev"
}

mount {
  src: "/tmp"
  dst: "/tmp"
  is_bind: true
  rw: true
  options: "nosuid,nodev"
}

# The bot command is appended after `--` on the nsjail command line:
#   nsjail -C nsjail.cfg -- /usr/bin/python3 /work/main.py
